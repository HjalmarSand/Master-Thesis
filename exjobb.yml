# Uses Conda for the base environment and Pip for the ML stack.
name: exjobb_pip
channels:
  - conda-forge
  - defaults

dependencies:
  # 1. Core packages to be installed by Conda.
  - python=3.11
  - geopandas
  - pdal
  - opencv
  - pyside6
  - black
  - flake8
  - pip

  # 2. All other packages will be installed by Pip.
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu124
    
    - torch>=2.6
    - torchvision
    - torchaudio

    - transformers
    - datasets
    - tokenizers
    - safetensors
    - pandas
    - numpy
    - scikit-learn
    - matplotlib
    - tqdm
    - segment-anything